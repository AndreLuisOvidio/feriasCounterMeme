<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eu te amo — Desde 17/08/2025</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin: 0;
    }

    p {
      margin: 8px 0;
      opacity: 0.8;
    }

    .heart {
      font-size: 3rem;
      animation: pulse 1.5s infinite;
      cursor: pointer;
      margin: 16px 0;
      display: inline-block;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .floating-heart {
      position: absolute;
      font-size: 1.5rem;
      color: #ff4d6d;
      animation: floatUp 4s linear forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Eu te amo ❤️</h1>
    <p>Desde 17/08/2025</p>
    <div class="heart" id="bigHeart">❤️</div>
    <p id="timer">Carregando...</p>
  </div>

  <script>
    const startDate = new Date('2025-08-17T00:00:00-03:00');
    const timerEl = document.getElementById('timer');
    const bigHeart = document.getElementById('bigHeart');

    function updateTimer() {
      const now = new Date();
      let diff = Math.floor((now - startDate) / 1000);
      if (diff < 0) {
        timerEl.textContent = 'Ainda não começou...';
        return;
      }
      const days = Math.floor(diff / 86400);
      diff %= 86400;
      const hours = Math.floor(diff / 3600);
      diff %= 3600;
      const mins = Math.floor(diff / 60);
      const secs = diff % 60;
      timerEl.textContent = `${days} dias • ${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
    setInterval(updateTimer, 1000);
    updateTimer();

    function createFloatingHeart() {
      const heart = document.createElement('div');
      heart.textContent = '❤️';
      heart.classList.add('floating-heart');
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.bottom = '0px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 4000);
    }

    bigHeart.addEventListener('click', createFloatingHeart);
    setInterval(createFloatingHeart, 1500);
  </script>
</body>
</html>
